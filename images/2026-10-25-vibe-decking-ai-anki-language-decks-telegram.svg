<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101f"/>
      <stop offset="55%" stop-color="#101c3a"/>
      <stop offset="100%" stop-color="#0b2b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="330" fill="url(#glow)"/>
  <circle cx="140" cy="600" r="340" fill="url(#glow2)"/>

  <!-- study motif: a small stack of language flashcards -->
  <g>
    <rect x="795" y="175" width="285" height="112" rx="22" fill="#ffffff"
          fill-opacity="0.035" stroke="#ffffff" stroke-opacity="0.07"/>

    <rect x="820" y="205" width="285" height="112" rx="22" fill="#ffffff"
          fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="848" y="238" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="12"
          letter-spacing="3" fill="#2dd4bf">FRONT</text>
    <text x="848" y="295" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="46"
          font-weight="600" fill="#eafffb">안녕</text>

    <rect x="875" y="365" width="285" height="112" rx="22" fill="#2dd4bf"
          fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity="0.42"/>
    <text x="903" y="398" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="12"
          letter-spacing="3" fill="#2dd4bf">BACK</text>
    <text x="903" y="455" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="42"
          font-weight="600" fill="#d8fff9">hello</text>
  </g>

  <!-- spaced repetition: widening review intervals -->
  <g>
    <text x="830" y="528" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="14"
          letter-spacing="2" fill="#9fb3d1">1d · 3d · 7d · 14d</text>
    <circle cx="898" cy="558" r="5" fill="#2dd4bf" fill-opacity="0.35"/>
    <circle cx="950" cy="558" r="7" fill="#2dd4bf" fill-opacity="0.5"/>
    <circle cx="1015" cy="558" r="9" fill="#2dd4bf" fill-opacity="0.65"/>
    <circle cx="1095" cy="558" r="11" fill="#2dd4bf" fill-opacity="0.8"/>
  </g>

  <!-- header -->
  <circle cx="102" cy="106" r="9" fill="#2dd4bf"/>
  <text x="126" y="116" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="26" font-weight="700"
        letter-spacing="7" fill="#2dd4bf">LANGUAGE DECKS · FIELD NOTES</text>

  <!-- headline + subtitle -->
    <text x="90" y="216" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1">Let your AI</text>
    <text x="90" y="321" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1">chat build the</text>
    <text x="90" y="426" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1">deck</text>
    <rect x="92" y="465" width="120" height="8" rx="4" fill="#2dd4bf"/>
    <text x="90" y="527" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#c3c9e6">A no-code language deck workflow —</text>
    <text x="90" y="577" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#c3c9e6">and the review step that matters</text>
</svg>
