<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180a0a"/>
      <stop offset="55%" stop-color="#341010"/>
      <stop offset="100%" stop-color="#4a2503"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d32f2f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d32f2f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc107" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffc107" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1010" cy="150" r="330" fill="url(#glow)"/>
  <circle cx="140" cy="600" r="340" fill="url(#glow2)"/>

  <!-- language-exchange motif: two chat bubbles, right column -->
  <g>
    <rect x="820" y="215" width="290" height="104" rx="30" fill="#ffffff"
          fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="860" y="285" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="48"
          font-weight="500" fill="#e9ecff">hola</text>

    <rect x="880" y="360" width="270" height="104" rx="30" fill="#ffc107"
          fill-opacity="0.16" stroke="#ffc107" stroke-opacity="0.4"/>
    <text x="920" y="430" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="48"
          font-weight="600" fill="#fff3d0">你好</text>

    <path d="M905 460 L886 504 L948 470 Z"
          fill="#ffc107" fill-opacity="0.55"/>
  </g>

  <!-- header -->
  <circle cx="102" cy="106" r="9" fill="#ffc107"/>
  <text x="126" y="116" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="26" font-weight="700"
        letter-spacing="7" fill="#ffc107">GWING · FLUTTER</text>

  <!-- headline + subtitle -->
    <text x="90" y="195" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1">Telegram-style</text>
    <text x="90" y="300" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1">photo albums</text>
    <text x="90" y="405" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="92" font-weight="800" fill="#ffffff" letter-spacing="-1">in Flutter</text>
    <rect x="92" y="444" width="120" height="8" rx="4" fill="#ffc107"/>
    <text x="90" y="506" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#c3c9e6">GwinG — a language-exchange</text>
    <text x="90" y="556" font-family="Noto Sans, Liberation Sans, DejaVu Sans, sans-serif" font-size="37" font-weight="400" fill="#c3c9e6">messenger with live translation</text>
</svg>
